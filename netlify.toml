# In My Style — Netlify beállítások
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # A termék-táblázat (Google Táblázat) csak olvasható adatcíme: innen jönnek a termékek és az új fotók.
  SHEET_API = "https://script.google.com/macros/s/AKfycbwPHcrouKtKkaZpOlyh6HZHtcikW8svsNcM5uOCaFCnq0P3ax_xUNDyx5tzYdCl-u3OqA/exec"

# Az átirányításokat a build generálja: dist/_redirects (a kategóriák régi címei is)

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
