<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategória — In My Style</title>
  <meta name="robots" content="noindex,follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <section class="category-hero">

      <div class="breadcrumb"><a href="index.html">Kollekciók</a> / <span id="cat-name">Kategória</span></div>

    renderCategoryOverview("category-overview");
